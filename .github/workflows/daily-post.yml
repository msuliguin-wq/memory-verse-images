name: Daily Instagram Verse Post

on:
  schedule:
    # 23:30 UTC = 7:30 AM Philippine Time (UTC+8)
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate the reel but do NOT publish to Instagram (preview only)"
        type: boolean
        default: false
      voice_samples:
        description: "Instead of posting, generate short narration samples across several voices for comparison"
        type: boolean
        default: false
      fetch_backgrounds:
        description: "One-off: download the new background photos into backgrounds/ and commit them (does not post)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate voice samples (preview only, no posting)
        if: github.event.inputs.voice_samples == 'true'
        run: python voice_samples.py --outdir /tmp/voice_samples

      - name: Upload voice samples artifact
        if: github.event.inputs.voice_samples == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: /tmp/voice_samples/*.mp3
          if-no-files-found: error
          retention-days: 3

      - name: Commit voice samples to repo (temporary preview)
        if: github.event.inputs.voice_samples == 'true'
        run: |
          mkdir -p voice_samples_preview
          cp /tmp/voice_samples/*.mp3 voice_samples_preview/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add voice_samples_preview
          git commit -m "Add voice sample preview files (temporary)" || echo "Nothing to commit"
          git push

      - name: Fetch new background photos (one-off, does not post)
        if: github.event.inputs.fetch_backgrounds == 'true'
        run: |
          mkdir -p backgrounds
          curl -L -o backgrounds/mountain_sunrise.jpg "https://images.unsplash.com/photo-1540979388789-6cee28a1cdc9?w=1600&q=85&fm=jpg"
          curl -L -o backgrounds/starry_night.jpg "https://images.unsplash.com/photo-1628498188904-036f5e25e93e?w=1600&q=85&fm=jpg"
          curl -L -o backgrounds/wheat_field.jpg "https://images.unsplash.com/photo-1595024600400-2a49b9fce270?w=1600&q=85&fm=jpg"
          curl -L -o backgrounds/still_lake.jpg "https://images.unsplash.com/photo-1621519997950-158b631341b6?w=1600&q=85&fm=jpg"
          curl -L -o backgrounds/desert_path.jpg "https://images.unsplash.com/photo-1763805769160-7a0e20fa9915?w=1600&q=85&fm=jpg"
          curl -L -o backgrounds/autumn_forest.jpg "https://images.unsplash.com/photo-1603312448224-e2d8c074ce26?w=1600&q=85&fm=jpg"
          curl -L -o backgrounds/waterfall.jpg "https://images.unsplash.com/photo-1494472155656-f34e81b17ddc?w=1600&q=85&fm=jpg"
          curl -L -o backgrounds/rolling_hills.jpg "https://images.unsplash.com/photo-1713669374349-3a240c47f727?w=1600&q=85&fm=jpg"
          ls -la backgrounds/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backgrounds
          git commit -m "Add 8 new background photos (12 total in rotation)" || echo "Nothing to commit"
          git push

      - name: Generate reel and publish to Instagram
        id: post
        if: github.event.inputs.voice_samples != 'true' && github.event.inputs.fetch_backgrounds != 'true'
        run: |
          set -o pipefail
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python post.py \
            --ig-user-id "${{ secrets.IG_USER_ID }}" \
            --access-token "${{ secrets.IG_ACCESS_TOKEN }}" \
            --github-owner "${{ github.repository_owner }}" \
            --github-repo "${{ github.event.repository.name }}" \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            $DRY_RUN_FLAG \
            | tee post_output.txt
          # pipefail above makes this step fail (non-zero) if python itself
          # crashed, instead of silently reporting tee's exit code (0).
          echo "new_token=$(grep '^NEW_TOKEN=' post_output.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: Upload reel preview artifact
        if: always() && github.event.inputs.voice_samples != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel-preview
          path: |
            /tmp/reel_*.mp4
            /tmp/narration_*.mp3
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit reel preview to repo (temporary, dry-run only)
        if: always() && github.event.inputs.dry_run == 'true' && github.event.inputs.voice_samples != 'true'
        run: |
          mkdir -p reel_preview
          cp /tmp/reel_*.mp4 reel_preview/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reel_preview
          git commit -m "Add reel preview file (temporary)" || echo "Nothing to commit"
          git push

      - name: Rotate access token secret (if refreshed)
        if: steps.post.outputs.new_token != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_PAT }}
          NEW_TOKEN: ${{ steps.post.outputs.new_token }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh secret set IG_ACCESS_TOKEN --body "$NEW_TOKEN" --repo "${{ github.repository }}"
            echo "Rotated IG_ACCESS_TOKEN secret automatically."
          else
            echo "No REPO_ADMIN_PAT secret set, so the refreshed token below was NOT saved automatically."
            echo "The current IG_ACCESS_TOKEN secret is still valid for a while, but for uninterrupted"
            echo "posting, either (a) add a REPO_ADMIN_PAT secret (a fine-grained GitHub PAT for this"
            echo "repo with Contents + Secrets: read/write) so this step can rotate it automatically, or"
            echo "(b) manually update the IG_ACCESS_TOKEN secret with the new token printed above every"
            echo "couple of months."
          fi
